# HikariCP - Connection Pool Configuration (optimizado para procesamiento paralelo)
# Tamaño mínimo del pool - mantiene conexiones listas incluso en periodos de baja carga
spring.datasource.hikari.minimum-idle=10
# Tamaño máximo del pool - permite hasta 20 conexiones concurrentes (4 hilos + buffer para otras operaciones)
spring.datasource.hikari.maximum-pool-size=20
# Timeout de conexión - tiempo máximo para obtener una conexión del pool (30 segundos)
spring.datasource.hikari.connection-timeout=30000
# Tiempo máximo que una conexión puede estar inactiva en el pool (10 minutos)
spring.datasource.hikari.idle-timeout=600000
# Tiempo máximo de vida de una conexión en el pool (30 minutos) - previene problemas con conexiones antiguas
spring.datasource.hikari.max-lifetime=1800000
# Tiempo máximo de espera para validar que la conexión está viva
spring.datasource.hikari.validation-timeout=5000
# Query para validar conexiones antes de usarlas
spring.datasource.hikari.connection-test-query=SELECT 1
# Habilitar auto-commit para compatibilidad con código existente
spring.datasource.hikari.auto-commit=true
# Nombre del pool para identificación en logs
spring.datasource.hikari.pool-name=GladiusHikariPool

